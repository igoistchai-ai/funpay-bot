services:
  - type: web
    name: funpay-auto-lister
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
